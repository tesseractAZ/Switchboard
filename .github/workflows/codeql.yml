# CodeQL security scanning.
#
# The repo is PUBLIC, so GitHub code scanning is available at no cost and the
# results are UPLOADED to the Security tab alongside the Dependabot alerts.
#
# The SARIF artifact and the hard CI gate are DELIBERATE, not redundant: the
# upload files an alert but does NOT fail the build, so without
# check-sarif.mjs a new high-severity finding would merge green.
#
# ── Why the ".agi shim" step exists ──────────────────────────────────────────
# MEASURED against a real run (not assumed): CodeQL's Python extractor DOES
# pick up the extensionless scripts in switchboard/rootfs/usr/bin (it reads the
# `#!` line), so those need no help. It does NOT pick up the 8 `.agi` voice
# flows — a non-Python extension wins over the shebang, and they were extracted
# only via the shim.
#
# So the step below is scoped to `.agi` ONLY. Shimming the bin scripts as well
# (the first cut of this workflow) made CodeQL analyse each of them twice and
# report every finding twice — 16 real results arrived as 28.
#
# The copies exist in the CI checkout only: never committed, never in the image.
# An alert against `switchboard-operator.py` refers to `switchboard-operator.agi`.
name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '41 5 * * 2'   # weekly, Tuesday 05:41 UTC

permissions:
  contents: read
  actions: read            # CodeQL reads the workflow run for its analysis summary
  security-events: write   # REQUIRED to upload SARIF; without it the upload 403s

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Pinned to 24.04, not 26.04 like every other job: CodeQL's system
    # requirements list Ubuntu 22.04 and 24.04 only (checked 2026-10-12), and
    # GitHub's floating "latest" label becomes 26.04 on 2026-10-19. Move it
    # when 26.04 is listed; tests/test_workflow_runners.py pins both halves.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            sarif: python.sarif
          - language: javascript-typescript
            sarif: javascript.sarif
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage .agi voice flows for the extractor
        if: matrix.language == 'python'
        run: |
          set -euo pipefail
          shimmed=0
          for f in switchboard/rootfs/var/lib/asterisk/agi-bin/*.agi; do
            [ -f "$f" ] || continue
            head -1 "$f" | grep -qE '^#!.*python' || continue
            cp "$f" "${f%.agi}.py"
            shimmed=$((shimmed + 1))
          done
          echo "staged $shimmed .agi file(s) for analysis"
          test "$shimmed" -gt 0   # a silent 0 here would mean the AGIs go unscanned

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended   # broader than default: more CodeQL-class rules
          config: |
            paths-ignore:
              # Vendored third-party asset, committed so the add-on needs no CDN.
              # Not our code to fix, and it dominates the JS corpus.
              - switchboard/rootfs/usr/share/switchboard/console-web/static/xterm.js
              # Test code is not attack surface, and treating it as a taint
              # SOURCE yields findings about production paths that cannot occur
              # in production (fixtures feed values no caller can supply).
              - switchboard/tests/**

      - name: Autobuild
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3

      - name: Perform CodeQL Analysis (uploads to the Security tab)
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          # `always` also writes the SARIF locally, so the artifact + the CI
          # gate below keep working.
          upload: always
          output: sarif-results

      - name: Publish SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          if-no-files-found: warn

      - name: Fail on actionable CodeQL findings
        run: node .github/scripts/check-sarif.mjs sarif-results/${{ matrix.sarif }}
