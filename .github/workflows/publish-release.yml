name: Publish release

# Second half of the release pipeline: gate on the tests, build the add-on image
# for every declared architecture, and cut the GitHub Release.
#
# It does NOT attach the manual — docs.yml already does that on
# `release: published`, so creating the release here triggers it. Two workflows
# building the same .docx would just race to upload the same asset.
#
# Triggered by tag-release.yml via workflow_dispatch (a tag pushed with
# GITHUB_TOKEN cannot trigger this on its own), or by a `v*` tag pushed by a
# human, or manually.
#
# NOTE ON IMAGES: config.yaml has no `image:` key, so Home Assistant builds this
# add-on from source on the target. The images pushed here are therefore a
# BUILD VERIFICATION and a ready-made artifact, not the install path — same as
# zwave-tui. Switching to prebuilt images (as ecoflow-panel does) means adding
# an `image:` key, which changes how every install updates; that is a separate,
# deliberate decision.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.46.2)'
        required: true
        type: string

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to GHCR

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and cross-check
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            v="$INPUT_VERSION"
          else
            v="${REF_NAME#v}"          # tag push: v0.46.2 -> 0.46.2
          fi
          v="${v#v}"
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unusable version '$v'"; exit 1
          fi

          cfg=$(grep -E '^version:' switchboard/config.yaml \
            | sed -E 's/version:[[:space:]]*"?([^"#]+)"?.*/\1/' | tr -d '[:space:]')
          if [ "$cfg" != "$v" ]; then
            echo "::error::Requested $v but switchboard/config.yaml says $cfg — refusing."
            exit 1
          fi
          echo "version=$v"  >> "$GITHUB_OUTPUT"
          echo "tag=v$v"     >> "$GITHUB_OUTPUT"
          echo "Releasing v$v"

  tests:
    name: Tests (release gate)
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check pytest pyyaml
      - name: Run the suite
        working-directory: switchboard
        run: python3 -m pytest tests/ -q

  images:
    name: Build & push image (${{ matrix.arch }})
    needs: [resolve, tests]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve BUILD_FROM from build.yaml
        id: base
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          img=$(awk -v arch="$ARCH" '
            /^build_from:/      { inblock = 1; next }
            inblock && /^[^[:space:]]/ { inblock = 0 }
            inblock && $1 == arch":" { print $2; found = 1; exit }
            END { if (!found) exit 1 }
          ' switchboard/build.yaml) || {
            echo "::error::no build_from entry for '$ARCH' in switchboard/build.yaml"
            exit 1
          }
          echo "image=$img" >> "$GITHUB_OUTPUT"

      # GHCR requires a lowercase repository path; github.repository_owner keeps
      # its original case, so lowercase it explicitly rather than hoping.
      - name: Compute image ref
        id: ref
        env:
          OWNER: ${{ github.repository_owner }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/${ARCH}-switchboard" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./switchboard
          file: ./switchboard/Dockerfile
          platforms: linux/${{ matrix.arch == 'aarch64' && 'arm64' || 'amd64' }}
          push: true
          tags: |
            ${{ steps.ref.outputs.image }}:${{ needs.resolve.outputs.version }}
            ${{ steps.ref.outputs.image }}:latest
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.image }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            BUILD_DESCRIPTION=Asterisk PBX for analog home phones
            BUILD_NAME=Switchboard
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ needs.resolve.outputs.version }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }},ignore-error=true

  release:
    name: Create the GitHub Release
    needs: [resolve, tests, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Release notes = this version's CHANGELOG section, so the release says
      # exactly what the changelog says and neither is written twice.
      - name: Extract the changelog section
        id: notes
        env:
          V: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="## $V" '
            $0 == v      { inside = 1; next }
            /^## [0-9]/  { if (inside) exit }
            inside       { print }
          ' switchboard/CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::warning::No '## $V' section in CHANGELOG.md — releasing with a stub note."
            echo "Release v$V." > /tmp/notes.md
          fi
          echo "--- notes ---"; cat /tmp/notes.md

      - name: Create the release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists — updating its notes."
            gh release edit "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md
          fi
          echo "Release $TAG is live; docs.yml will attach the manual."

      - name: Summary
        if: always()
        run: |
          {
            echo "## 🚀 Release ${{ needs.resolve.outputs.tag }}"
            echo
            echo "- tests: gated"
            echo "- images: amd64 + aarch64 pushed to GHCR"
            echo "- release: created (docs.yml attaches the .docx/.pdf manual)"
          } >> "$GITHUB_STEP_SUMMARY"
