name: Docs

# Assemble README + SECURITY + DOCS.md into one printable manual — an editable
# Word (.docx) and a reader-friendly PDF — on every push/PR, and attach both to
# each GitHub Release. Two purposes:
#   1. Gate: a DOCS.md that no longer converts cleanly (bad table, broken raw
#      block) fails the PR instead of silently shipping.
#   2. Distribution: reviewers get the offline manual for the branch as an
#      artifact, and every published release carries its documentation.
# Generator: scripts/build-docs-docx.py (pandoc for the .docx, LibreOffice for
# the .pdf — no LaTeX). Same process as the ecoflow-panel and zwave repos.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  # ★ The release path CANNOT rely on the event above. publish-release.yml
  # creates the Release with the default GITHUB_TOKEN, and GitHub does not emit
  # `release: published` for a release created that way — its recursion guard.
  # Fifteen releases (v0.69.0 to v0.80.0) shipped no manual because of it, with
  # every workflow green. workflow_dispatch is exempt from the guard, so
  # publish-release.yml now dispatches this explicitly and passes the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build the manual for and attach it to"
        required: false
        type: string

# Read is enough for the PR/push artifact path; the release path needs write to
# upload assets onto the Release.
permissions:
  contents: write

jobs:
  docs:
    name: Build documentation (.docx + .pdf)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure pandoc
        run: |
          command -v pandoc >/dev/null || { sudo apt-get update && sudo apt-get install -y pandoc; }
          pandoc --version | head -1

      # The manual embeds switchboard/docs/img/*.png. On a release this job builds
      # the TAG, while screenshots-refresh re-renders those images and commits
      # them to main only afterwards — so the committed images in the tag are the
      # PREVIOUS release's, and every release that changed the UI shipped a manual
      # picturing the old one. Render them here, from this checkout's own UI
      # source, before the manual is built (the commit back to main is unchanged).
      - name: Ensure a Chrome/Chromium binary
        run: |
          command -v google-chrome >/dev/null || command -v chromium-browser >/dev/null \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends chromium-browser; }
          (google-chrome --version || chromium-browser --version) 2>/dev/null | head -1

      - name: Render the screenshots this manual embeds
        run: |
          python3 scripts/build-screenshots.py
          test -s switchboard/docs/img/dashboard.png
          test -s switchboard/docs/img/console.png

      - name: Build .docx
        run: |
          python3 scripts/build-docs-docx.py \
            --ref "${GITHUB_REF_NAME}@${GITHUB_SHA:0:7}" \
            --output "Switchboard-Documentation.docx"

      # A PDF alongside the .docx — a faithful render of the SAME document (same
      # generated TOC + page breaks) via LibreOffice headless (no LaTeX). This is
      # a HARD gate (test -s below): a DOCS.md or toolchain change that can't
      # produce a PDF fails the check rather than silently shipping without one.
      - name: Ensure LibreOffice (docx → pdf)
        run: |
          command -v libreoffice >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer; }
          libreoffice --version | head -1

      # The typefaces the PDF must use, checked by ROLE before the build. The
      # .docx asks for Calibri (headings) and Cambria (body), pinned by
      # build-docs-docx.py; on Linux their faithful renderings are the
      # metric-compatible clones Carlito and Caladea, which libreoffice only
      # suggests and never installs. Code asks for Consolas, which has no Linux
      # clone: it is aliased to DejaVu Sans Mono, the face every earlier manual
      # used. Without this the first 26.04 manual shipped plain serif headings
      # and proportional code, and every check here was green.
      - name: Fonts for the PDF
        run: |
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20)
          timeout -k 10 120 sudo apt-get "${apt_opts[@]}" update
          timeout -k 10 300 sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends \
            fonts-crosextra-carlito fonts-crosextra-caladea fonts-dejavu
          conf_dir="${XDG_CONFIG_HOME:-$HOME/.config}/fontconfig/conf.d"
          mkdir -p "$conf_dir"
          cat > "$conf_dir/99-switchboard-manual.conf" <<'FONTCONF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias binding="same"><family>Consolas</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
          </fontconfig>
          FONTCONF
          fc-cache -f >/dev/null 2>&1 || true
          fail=0
          role () {   # <requested family> <expected family>
            got=$(fc-match -f '%{family[0]}' "$1")
            if [ "$got" = "$2" ]; then echo "font role: $1 -> $got"
            else echo "::error::font role: $1 resolves to '$got', expected '$2'"; fail=1; fi
          }
          role Calibri Carlito
          role Cambria Caladea
          role Consolas "DejaVu Sans Mono"
          [ "$(fc-match -f '%{spacing}' Consolas)" = 100 ] || { echo "::error::Consolas does not resolve to a monospaced face"; fail=1; }
          exit $fail

      - name: Build .pdf (render the .docx)
        run: |
          libreoffice --headless -env:UserInstallation=file:///tmp/loprofile \
            --convert-to pdf --outdir . "Switchboard-Documentation.docx"
          test -s Switchboard-Documentation.pdf
          ls -la Switchboard-Documentation.docx Switchboard-Documentation.pdf

      # And by what the PDF actually embedded: a role resolving correctly is not
      # proof that LibreOffice used it. Alternatives as A|B: Ubuntu's Carlito is
      # Carlito-Regular, LibreOffice's bundled copy Carlito.
      - name: Check the PDF's typefaces
        run: |
          embedded=" $(python3 - Switchboard-Documentation.pdf <<'PY'
          import re, sys, zlib
          data = open(sys.argv[1], "rb").read()
          blobs = [data]
          for m in re.finditer(rb"stream\r?\n(.*?)\r?\nendstream", data, re.S):
              try:
                  blobs.append(zlib.decompress(m.group(1)))
              except zlib.error:
                  pass
          names = {re.sub(rb"^[A-Z]{6}\+", b"", n).decode()
                   for b in blobs for n in re.findall(rb"/BaseFont\s*/([A-Za-z0-9+_.-]+)", b)}
          print(" ".join(sorted(names)))
          PY
          ) "
          echo "embedded:$embedded"
          missing=""
          for want in "Carlito|Carlito-Regular" "Carlito-Bold" "Caladea|Caladea-Regular" "DejaVuSansMono"; do
            ok=0
            for f in $(echo "$want" | tr '|' ' '); do case "$embedded" in *" $f "*) ok=1 ;; esac; done
            [ "$ok" = 1 ] || missing="$missing $want"
          done
          [ -z "$missing" ] || { echo "::error::the manual fell back from its typefaces; not embedded:$missing"; exit 1; }

      # Uploaded even when a check above failed, so the PDF can be looked at.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: documentation
          path: |
            Switchboard-Documentation.docx
            Switchboard-Documentation.pdf
          if-no-files-found: error

      # On a published release, attach both files (versioned filenames) as release
      # assets. Race-free: the release already exists when this event fires.
      - name: Attach to release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          v="${TAG#v}"
          cp Switchboard-Documentation.docx "Switchboard-Documentation-${TAG}.docx"
          cp Switchboard-Documentation.pdf  "Switchboard-Documentation-${TAG}.pdf"
          gh release upload "$TAG" \
            "Switchboard-Documentation-${TAG}.docx" \
            "Switchboard-Documentation-${TAG}.pdf" \
            --clobber --repo "$GITHUB_REPOSITORY"

  # Guard against screenshot rot: the images in switchboard/docs/img/ are rendered
  # from the REAL dashboard + console by scripts/build-screenshots.py. If a UI
  # change breaks that generator, this job fails here rather than leaving the
  # documentation quietly showing a UI that no longer exists. The freshly rendered
  # pair is uploaded as an artifact so a reviewer can eyeball drift against the
  # committed images (they are not auto-committed: font rendering differs between
  # this runner and a maintainer's machine, so byte-comparison would be noise).
  screenshots:
    name: Render documentation screenshots
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure a Chrome/Chromium binary
        run: |
          command -v google-chrome >/dev/null || command -v chromium-browser >/dev/null \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends chromium-browser; }
          (google-chrome --version || chromium-browser --version) 2>/dev/null | head -1

      - name: Render screenshots from the live UI source
        run: |
          python3 scripts/build-screenshots.py --out-dir "$RUNNER_TEMP/shots"
          ls -la "$RUNNER_TEMP/shots"
          test -s "$RUNNER_TEMP/shots/dashboard.png"
          test -s "$RUNNER_TEMP/shots/console.png"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-rendered
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: error

  # HARD REFRESH. On a published release, re-render the screenshots from the
  # current UI and commit them back to main if they changed, so the documentation
  # images can never lag a release. The PR-time `screenshots` job above only
  # proves the generator still runs; this one is what keeps the committed pair
  # honest. Note the images will render with this runner's fonts, so the first
  # refresh may shift their appearance once and then stay stable.
  screenshots-refresh:
    name: Refresh committed screenshots (on release)
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Ensure a Chrome/Chromium binary
        run: |
          command -v google-chrome >/dev/null || command -v chromium-browser >/dev/null \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends chromium-browser; }

      - name: Re-render into the repo
        run: python3 scripts/build-screenshots.py

      - name: Commit only if the render actually changed
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if git diff --quiet -- switchboard/docs/img; then
            echo "screenshots unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add switchboard/docs/img
          # [skip ci] so this docs commit doesn't retrigger the workflow
          git commit -m "docs: refresh screenshots for ${TAG} [skip ci]"
          git push origin HEAD:main
