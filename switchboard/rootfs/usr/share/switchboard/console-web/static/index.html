<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Switchboard Operator Console</title>
<!-- Vendored offline (no CDN): xterm 5.3.0. -->
<link rel="stylesheet" href="./static/xterm.css" />
<style>
  /* Self-hosted typefaces, no external request. "../fonts/" (not "fonts/") on
     purpose: this one page is served at "/" by console-web/server.py AND at
     "/console/" by the webui under Ingress. From "/" the dot-dot clamps to the
     root ("/fonts/…", served by server.py); from "/console/" it climbs to the
     add-on root, where the webui serves the same shared directory. The files
     may be absent (tests, older images): every stack below has fallbacks. */
  @font-face {
    font-family: "Cutive Mono";
    src: url("../fonts/CutiveMono-Regular.ttf") format("truetype");
    font-display: swap;
  }
  @font-face {
    font-family: "Federo";
    src: url("../fonts/Federo-Regular.ttf") format("truetype");
    font-display: swap;
  }

  :root {
    color-scheme: dark;
    --walnut-0: #120c08;
    --walnut-1: #1d140e;
    --walnut-2: #2a1d14;
    --brass: #c8a24a;
    --brass-dim: #7a6230;
    --enamel: #efe6cf;
    --ink: #241a12;
    --lamp: #ffb547;
    --lamp-idle: #5b4a36;
    --ok: #e9dfc4;
    --fault: #c0392b;
    --muted: #9b8a72;
    --font-type: "Cutive Mono", "Courier Prime", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --font-plate: "Federo", "Didot", serif;
    --band-h: 38px;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
  }
  body {
    /* Walnut grain: two fine cross-grain stripes over a slow vertical shade,
       with a faint field of brass jack holes on top. No images. */
    background-color: var(--walnut-0);
    background-image:
      radial-gradient(circle, rgba(200, 162, 74, .035) 1.2px, transparent 1.8px),
      repeating-linear-gradient(91deg, rgba(255, 236, 200, .014) 0 1px, transparent 1px 6px),
      repeating-linear-gradient(88.5deg, rgba(0, 0, 0, .22) 0 2px, transparent 2px 13px),
      linear-gradient(180deg, var(--walnut-1), var(--walnut-0) 60%);
    background-size: 22px 22px, auto, auto, auto;
    color: var(--enamel);
    font-family: var(--font-type);
  }
  :focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

  /* The page chrome is the cabinet's engraved brass nameplate — the one bold
     element. The terminal below it stays a flat walnut field for legibility. */
  .band {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: var(--band-h);
    padding-top: env(safe-area-inset-top, 0px);
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid var(--brass-dim);
    box-sizing: content-box;
  }
  .plate {
    display: inline-flex;
    align-items: baseline;
    gap: .9em;
    margin: 0;
    padding: 3px 22px 2px;
    position: relative;
    border: 1px solid var(--brass-dim);
    border-radius: 2px;
    background: linear-gradient(180deg, #e2c46e 0%, var(--brass) 48%, #a8853a 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 244, 214, .55),
      inset 0 -1px 0 rgba(0, 0, 0, .35),
      0 1px 3px rgba(0, 0, 0, .65);
    color: var(--ink);
    /* Engraving: the cut letters catch light on their lower edge. */
    text-shadow: 0 1px 0 rgba(255, 238, 196, .5);
    font-size: 16px;
    font-weight: normal;
    line-height: 1.25;
    white-space: nowrap;
  }
  /* Two slotted brass screws hold the plate on. Decorative only. */
  .plate::before, .plate::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 7px;
    height: 7px;
    margin-top: -3.5px;
    border-radius: 50%;
    background:
      linear-gradient(135deg, transparent 43%, rgba(36, 26, 18, .75) 43% 57%, transparent 57%),
      radial-gradient(circle at 35% 35%, #f3dc94, #8a6d2e 75%);
    box-shadow: 0 0 0 1px rgba(36, 26, 18, .35);
  }
  .plate::before { left: 7px; }
  .plate::after { right: 7px; }
  .plate-name {
    font-family: var(--font-plate);
    font-size: 17px;
    text-transform: uppercase;
    letter-spacing: .18em;
    /* letter-spacing trails the last glyph; pull it back so the word centres. */
    margin-right: -.18em;
  }
  .plate-sub {
    font-family: var(--font-type);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  #term {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    top: calc(var(--band-h) + 1px + env(safe-area-inset-top, 0px));
    padding: 6px;
    box-sizing: border-box;
  }
  /* Keep the xterm viewport on the walnut ground even before it paints. */
  .xterm, .xterm-viewport, .xterm-screen { background: var(--walnut-0) !important; }
  .xterm .xterm-viewport { scrollbar-color: var(--brass-dim) var(--walnut-0); }

  /* Status reads as a typed designation strip: ink on cream enamel. */
  #status {
    position: absolute;
    left: 50%;
    top: calc(50% + var(--band-h) / 2);
    transform: translate(-50%, -50%);
    box-sizing: border-box;
    /* max-content: at left:50% the shrink-to-fit width alone would cap the
       strip at half the window and wrap a one-line message into three. */
    width: max-content;
    max-width: calc(100% - 32px);
    padding: 8px 16px;
    background: var(--enamel);
    color: var(--ink);
    border: 1px solid var(--brass-dim);
    border-radius: 1px;
    box-shadow: 0 0 0 3px var(--walnut-1), 0 2px 10px rgba(0, 0, 0, .6);
    font: 15px/1.5 var(--font-type);
    text-align: center;
    pointer-events: none;
    z-index: 5;
  }

  @media (max-width: 440px) {
    .plate-sub { display: none; }
    .plate-name { font-size: 15px; }
  }
</style>
</head>
<body>
  <header class="band">
    <h1 class="plate"><span class="plate-name">Switchboard</span><span class="plate-sub">Operator console</span></h1>
  </header>
  <div id="term"></div>
  <div id="status" role="status">Connecting to the operator console…</div>
  <script src="./static/xterm.js"></script>
  <script>
  (function () {
    "use strict";

    var statusEl = document.getElementById("status");
    // Reconnect delay, grown on each failed attempt and reset on a real
    // connection. Declared here so onclose and onopen share one value.
    var backoff = 2000;
    function setStatus(text) {
      if (!text) { statusEl.style.display = "none"; return; }
      statusEl.style.display = "block";
      statusEl.textContent = text;
    }

    // If xterm.js did not load, `new Terminal(...)` throws and the page is left
    // showing "Connecting to the operator console…" forever — indistinguishable
    // from a live page whose telnet socket is dead. Under Ingress the asset URLs
    // are relative, so a missing trailing slash on /console resolves them one
    // directory up and produces exactly that silent failure.
    if (typeof Terminal === "undefined") {
      setStatus("Terminal assets failed to load (xterm.js). Check the /console/ URL ends with a slash.");
      return;
    }

    // The console's 256-colour codes, landed on the exact page tokens. A real
    // telnet client shows xterm's nearest stock colour for the same index; here
    // the terminal matches the rest of the add-on. Index = colour - 16; every
    // index left unset keeps xterm's default.
    var extendedAnsi = [];
    extendedAnsi[58 - 16] = "#5b4a36";    // idle lamp  → --lamp-idle
    extendedAnsi[94 - 16] = "#7a6230";    // ink / dim  → --brass-dim
    extendedAnsi[137 - 16] = "#9b8a72";   // muted      → --muted
    extendedAnsi[160 - 16] = "#c0392b";   // fault      → --fault
    extendedAnsi[178 - 16] = "#c8a24a";   // brass      → --brass
    extendedAnsi[214 - 16] = "#ffb547";   // amber      → --lamp
    extendedAnsi[230 - 16] = "#efe6cf";   // cream      → --enamel

    var reduceMotion = !!(window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches);

    var term = new Terminal({
      convertEol: false,
      cursorBlink: !reduceMotion,
      fontFamily: "'Cutive Mono', 'Courier Prime', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace",
      fontSize: 18,
      scrollback: 1000,
      // Text must hold 4.5:1 on the walnut ground whatever colour the console
      // picks (the fault red alone is ~3.6:1). xterm lifts only the cells that
      // fall short and leaves box-drawing rules at their exact brass.
      minimumContrastRatio: 4.5,
      theme: {
        background: "#120c08",                    // --walnut-0
        foreground: "#efe6cf",                    // --enamel
        cursor: "#ffb547",                        // --lamp
        cursorAccent: "#120c08",                  // --walnut-0
        selectionBackground: "rgba(200, 162, 74, 0.3)",          // --brass at 30 %
        selectionInactiveBackground: "rgba(122, 98, 48, 0.3)",   // --brass-dim at 30 %
        // The plain 16-colour path, mapped onto the lamps: green is a lit
        // WHITE lamp (ok), yellow the amber lamp, red the red cord.
        black: "#2a1d14",          // --walnut-2
        red: "#c0392b",            // --fault
        green: "#e9dfc4",          // --ok
        yellow: "#ffb547",         // --lamp
        blue: "#9b8a72",           // --muted
        magenta: "#7a6230",        // --brass-dim
        cyan: "#c8a24a",           // --brass
        white: "#efe6cf",          // --enamel
        brightBlack: "#9b8a72",    // --muted (the console's grey)
        brightRed: "#e5604f",      // --fault, lit
        brightGreen: "#efe6cf",    // --enamel
        brightYellow: "#ffb547",   // --lamp
        brightBlue: "#9b8a72",     // --muted
        brightMagenta: "#c8a24a",  // --brass
        brightCyan: "#c8a24a",     // --brass
        brightWhite: "#fbf5e6",    // --enamel, lit
        extendedAnsi: extendedAnsi
      }
    });

    // Measure the terminal cell so we can size cols/rows to the window without
    // pulling in the fit-addon (keeps the vendored payload to two files).
    function measureCell() {
      var probe = document.createElement("span");
      probe.style.position = "absolute";
      probe.style.visibility = "hidden";
      probe.style.whiteSpace = "pre";
      probe.style.fontFamily = term.options.fontFamily;
      probe.style.fontSize = term.options.fontSize + "px";
      probe.textContent = "MMMMMMMMMMMMMMMMMMMM"; // 20 chars
      document.body.appendChild(probe);
      var w = probe.getBoundingClientRect().width / 20;
      var h = probe.getBoundingClientRect().height;
      document.body.removeChild(probe);
      return { w: w || 10.8, h: h || 22 };  // ~18px monospace fallback
    }

    function computeSize() {
      var cell = measureCell();
      var host = document.getElementById("term");
      var padding = 12; // 6px each side from #term
      var cols = Math.max(20, Math.floor((host.clientWidth - padding) / cell.w));
      var rows = Math.max(6, Math.floor((host.clientHeight - padding) / cell.h));
      return { cols: cols, rows: rows };
    }

    var ws = null;
    var lastCols = 0, lastRows = 0;

    // ★ `force` exists because "unchanged locally" is NOT "the server knows".
    //
    // The old shape returned early whenever the measurement matched the cached
    // one — and the cache was filled by the applySize(false) call that runs at
    // startup, BEFORE the socket exists. So on a fresh connection the one call
    // that would actually transmit the size (from ws.onopen) matched the cache
    // and returned without sending. The console never learned the window size
    // and stayed at its built-in 80x24 for the life of the page, with the rest
    // of the terminal left blank — most visible on a long screen like LIGHTS,
    // which simply stopped part-way down the list.
    //
    // The cache is a guard against redundant term.resize() work. It must not
    // gate the handshake.
    function applySize(send, force) {
      var s = computeSize();
      var changed = (s.cols !== lastCols || s.rows !== lastRows);
      if (changed) {
        lastCols = s.cols;
        lastRows = s.rows;
        term.resize(s.cols, s.rows);
      }
      if (send && ws && ws.readyState === WebSocket.OPEN && (changed || force)) {
        // Tell the server the new dimensions; it maps them to a telnet NAWS
        // subnegotiation for the operator console.
        ws.send(JSON.stringify({ type: "resize", cols: s.cols, rows: s.rows }));
      }
    }

    function connect() {
      var proto = (location.protocol === "https:") ? "wss" : "ws";
      // Relative path so this works no matter the host/port it's served on.
      var base = location.pathname.replace(/\/+$/, "");
      var url = proto + "://" + location.host + base + "/ws";
      setStatus("Connecting to the operator console…");
      ws = new WebSocket(url);
      ws.binaryType = "arraybuffer";

      ws.onopen = function () {
        backoff = 2000;   // a real connection resets the ladder
        setStatus("");
        applySize(true, true);   // always announce the size on a new socket
      };
      ws.onmessage = function (ev) {
        var data = ev.data;
        if (data instanceof ArrayBuffer) {
          term.write(new Uint8Array(data));
        } else {
          term.write(data);
        }
      };
      ws.onclose = function (ev) {
        ws = null;
        // 1000 = we closed cleanly; 1013 = the server said "all sessions busy".
        // Reconnecting on either produces a hot loop that occupies the very
        // session slots it is waiting for, and re-opens a console session on a
        // page nobody is looking at.
        if (ev && (ev.code === 1000 || ev.code === 1013)) {
          setStatus(ev.code === 1013
            ? "Console busy — all sessions in use. Reload to try again."
            : "Session ended. Reload to reconnect.");
          return;
        }
        // Capped exponential backoff with jitter. A flat 2 s retry against a
        // service that is down hammers it, and against an Ingress session that
        // has expired it reconnects forever behind a panel nobody is watching.
        backoff = Math.min(Math.round(backoff * 1.7), 30000);
        var wait = backoff + Math.floor(Math.random() * 750);
        setStatus("Disconnected. Reconnecting in " + Math.round(wait / 1000) + "s…");
        setTimeout(connect, wait);
      };
      ws.onerror = function () {
        try { ws.close(); } catch (e) {}
      };
    }

    term.onData(function (data) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(data);
      }
    });

    var resizeTimer = null;
    function scheduleResize() {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () { applySize(true); }, 120);
    }
    window.addEventListener("resize", scheduleResize);

    // ★ window.resize is not sufficient here. This page is embedded in a Home
    // Assistant dashboard as an iframe whose height the PARENT sets once the
    // card has laid out — after this script has already measured. That grows
    // the element without the iframe's own window ever firing a resize event,
    // so the terminal would keep whatever size it guessed at startup.
    if (window.ResizeObserver) {
      new ResizeObserver(scheduleResize).observe(document.getElementById("term"));
    }

    // ★ Open and fit only once the typeface is in. xterm measures its cell when
    // it opens, and measureCell() above measures the same font: done against
    // the fallback, a later swap to Cutive Mono would leave both the grid and
    // the cols/rows sent to the console sized for the wrong glyphs. A missing
    // or slow font file must not hold the console hostage, so the wait is
    // capped and a failed load starts the terminal on the fallback stack.
    function whenFontsReady(go) {
      var started = false;
      function once() { if (!started) { started = true; go(); } }
      if (!document.fonts || !document.fonts.load) { once(); return; }
      setTimeout(once, 2500);
      document.fonts.load(term.options.fontSize + "px 'Cutive Mono'")
        .then(function () { return document.fonts.ready; })
        .then(once, once);
    }

    whenFontsReady(function () {
      term.open(document.getElementById("term"));
      applySize(false);
      connect();
      term.focus();
    });
  })();
  </script>
</body>
</html>
