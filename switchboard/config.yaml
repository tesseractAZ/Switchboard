---
name: Switchboard
version: "0.74.0"
slug: switchboard
description: >-
  Self-hosted Asterisk PBX for analog home phones via a Grandstream GXW4216 V2.
  Room-to-room calling now, SIP trunk outside-line ready. G.711 u-law only,
  end to end (no HD/Opus, no transcoding).
url: https://github.com/tesseractAZ/Switchboard/tree/main/switchboard
arch:
  - amd64
  - aarch64
init: false
host_network: true
apparmor: true
# Start in the SERVICES phase, not the default 'application'. Asterisk, the GXW
# gateway and the SIP trunk have no dependency on Home Assistant Core, but the
# default phase queues the whole PBX behind Core reaching RUNNING — measured at
# 66.4 s behind the first services-phase add-on on the 2026-08-25 boot, and
# unbounded if Core ever stalls (a recorder migration on a dirty database, or a
# wedged custom integration). Dial tone, including the 911 path, should not wait
# on a home-automation server. Safe because the HA-facing pollers degrade rather
# than exit when Core is absent: ha_client.set_state() returns False instead of
# raising, and each poller retries on its next cycle.
startup: services
# Every backup of this add-on runs HOT -- an audit of 3975 Supervisor lines found
# 18 "Stopping app_" entries and none was Switchboard, and 13 of 16 add-on updates
# in that window took no pre-update backup at all. So the call-quality ledger and
# the durable Asterisk log are copied mid-append with no flush barrier. Going COLD
# was rejected deliberately: it would drop dial tone, including the 911 path, for
# the ~15 s the image export takes, every night. The pre-hook flushes state to
# disk instead; readers already tolerate a torn trailing line, and neither hook
# can fail a backup.
backup: hot
backup_pre: /usr/bin/switchboard-backup-pre
backup_post: /usr/bin/switchboard-backup-post
# Supervisor API access — auto-detect the Home Assistant timezone (talking clock
# / wake-up calls). Home Assistant Core API access — the voice/TUI/GUI home-
# automation feature reads light states and calls light.turn_on/turn_off via the
# Supervisor proxy with the add-on's SUPERVISOR_TOKEN (no separate credential).
hassio_api: true
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:phone-classic
panel_title: Switchboard
map:
  # 'app_config' is the current name for the add-on's own config dir (host:
  # /addon_configs/<slug>/) — the Supervisor warns on the legacy 'addon_config'
  # spelling ("uses legacy map type 'addon_config'; use 'app_config' instead").
  - type: app_config
    read_only: false
  - type: share
    read_only: false
