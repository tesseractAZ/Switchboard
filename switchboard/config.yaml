  automation_enabled: true
  automation_ext: "43"
  page_enabled: true
  page_ext: "44"
  mwi_enabled: true
  status_enabled: true
  status_ext: "45"
  assistant_enabled: false
  assistant_ext: "47"
  wakeup_retry_seconds: 90
  wakeup_push_target: "mobile_app_iphone"
  status_power_grid: ""
