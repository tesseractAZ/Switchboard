  cordless_battery_warn_pct: 30
  cordless_wifi_min_signal: 2
  announce_token: ""
  console_enabled: true
  console_port: 2300
  console_bind: "0.0.0.0"
  console_web_enabled: true
  console_web_port: 8100
  console_web_bind: ""
  console_users: []
  timezone: ""
  clock_enabled: true
  clock_ext: "41"
  wakeup_enabled: true
